apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mcp-gateway.fullname" . }}-test-connection"
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: healthz
      image: curlimages/curl:8.13.0
      command: ["curl"]
      args: ["-fsS", "http://{{ include "mcp-gateway.fullname" . }}:{{ .Values.service.port }}/healthz"]
  restartPolicy: Never
