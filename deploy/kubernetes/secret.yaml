apiVersion: v1
kind: Secret
metadata:
  name: mcp-gateway
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-gateway
type: Opaque
stringData:
  # Initial admin password, used only when seeding the first user.
  # Change this before applying, and change the password after first login.
  admin-password: change-me
  # JWT signing secret. Replace with e.g. `openssl rand -hex 32`.
  # If removed, the gateway generates one on first start and persists it
  # in the database.
  jwt-secret: replace-with-a-random-secret
