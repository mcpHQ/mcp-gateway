# Default values for mcp-gateway.

# MCP Gateway uses an embedded SQLite database, so it must run as a single
# replica against a ReadWriteOnce volume. Do not increase this unless your
# storage provides reliable SQLite file locking across pods.
#
# See ../../docs/SCALABILITY.md for the plan to remove this restriction.
# Ignored when autoscaling.enabled is true.
replicaCount: 1

image:
  repository: ghcr.io/mcphq/mcp-gateway
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

gateway:
  # HTTP listen port inside the container (-addr flag).
  port: 8080
  # Path to the SQLite database inside the container (-db flag).
  dbPath: /data/mcp-gateway.db
  # Initial admin account, used only when seeding the first user.
  # Change the password after first login.
  adminEmail: admin@mcphq.org
  adminPassword: ""
  # JWT signing secret. Leave empty to let the gateway generate one on first
  # start and persist it in the database.
  jwtSecret: ""
  # Name of an existing Secret to use instead of the chart-managed one.
  # Expected keys: admin-password, jwt-secret (both optional).
  existingSecret: ""

# Extra environment variables for the gateway container. Useful for upstream
# secret interpolation, e.g. a server configured with `${GITHUB_TOKEN}`:
#
# extraEnv:
#   - name: GITHUB_TOKEN
#     valueFrom:
#       secretKeyRef:
#         name: github-credentials
#         key: token
extraEnv: []

# Extra envFrom sources (ConfigMaps or Secrets) for the gateway container.
extraEnvFrom: []

persistence:
  enabled: true
  # Use an existing PersistentVolumeClaim instead of creating one.
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mcp-gateway.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: mcp-gateway-tls
  #    hosts:
  #      - mcp-gateway.example.com

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Horizontal Pod Autoscaler for the gateway Deployment.
#
# WARNING: Do not enable this while the gateway is backed by the embedded
# SQLite database (the default). Scaling beyond one replica with SQLite
# causes concurrent writers to race for the same database file and each pod
# to hold a divergent in-memory tool/usage cache. Only enable this once the
# gateway is configured against an external, network-accessible database and
# distributed rate-limit/tool-cache state, per docs/SCALABILITY.md.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ""

# PodDisruptionBudget for the gateway Deployment. Only meaningful once more
# than one replica can safely run (see autoscaling above).
podDisruptionBudget:
  enabled: false
  minAvailable: ""
  maxUnavailable: 1

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5

# Additional volumes on the output Deployment definition.
extraVolumes: []

# Additional volumeMounts on the gateway container.
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
