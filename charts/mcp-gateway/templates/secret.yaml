{{- if and (not .Values.gateway.existingSecret) (or .Values.gateway.adminPassword .Values.gateway.jwtSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-gateway.fullname" . }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.gateway.adminPassword }}
  admin-password: {{ .Values.gateway.adminPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.gateway.jwtSecret }}
  jwt-secret: {{ .Values.gateway.jwtSecret | b64enc | quote }}
  {{- end }}
{{- end }}
